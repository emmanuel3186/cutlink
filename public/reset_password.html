<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password | cutlink</title>
  <link href="/output.css" rel="stylesheet" >
</head>
<body class="bg-[#fafaf8] font-sans text-slate-800 antialiased">
  
  <div class="flex min-h-screen items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
    <main class="w-full max-w-md space-y-8 rounded-xl bg-white p-8 shadow-md border border-slate-100">
      
      <header class="text-center">
        <span class="text-2xl font-extrabold tracking-tight text-indigo-600">Cutlink</span>
        <h1 class="mt-6 text-3xl font-bold text-slate-900">Create New Password</h1>
        <p class="mt-2 text-sm text-slate-600">Please choose a secure password for your account.</p>
      </header>

      <!-- Password Reset Form -->
      <form id="resetPasswordForm" class="space-y-5">
        
        <!-- New Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700">New Password</label>
          <div class="relative mt-1">
            <input type="password" id="password" 
                   class="h-12 w-full rounded-md border border-slate-300 bg-white px-4 text-base text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                   placeholder="At least 6 characters" />
            
            <button type="button" id="togglePasswordBtn" 
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer">
              <svg id="eyeIcon" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
          <p id="passwordError" class="mt-1 text-xs text-red-600 hidden"></p>
        </div>

        <!-- Action Button -->
        <button type="submit" id="submitBtn"
                class="h-12 w-full rounded-md bg-indigo-600 px-4 text-base font-semibold text-white transition hover:bg-indigo-700 focus:outline-none cursor-pointer disabled:opacity-50">
          Update Password
        </button>
        
        <!-- Success Feedback Banners -->
        <p id="success-message" class="mt-2 text-center text-sm font-medium text-emerald-600 hidden"></p>
      </form>

    </main>
  </div>

  <!-- Load your Master Router file -->
  <script src="/index.js" type="module" defer></script>
  <script src="/googleBtn.js" type="module" defer></script>
  <script src="/codeVerify.js" type="module" defer></script>
  <script src="/dashboard-shorturl.js" type="module" defer></script>
  <script src="/login.js" type="module" defer></script>
  <script src="/main-shorturl.js" type="module" defer></script>
  <script src="/password.js" type="module" defer></script>
  <script src="/signup.js" type="module" defer></script>
</body>
</html>
